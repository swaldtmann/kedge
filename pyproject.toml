[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kedge"
version = "0.4.0.dev0"
description = "Generic encrypted backup for Docker Compose stacks (Python port, Phase 1)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
kedge = "kedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "shiv>=1.0.4",
]
